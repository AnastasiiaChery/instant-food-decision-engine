services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      REDIS_URL: "redis://redis:6379"
      PORT: "8000"
      DISTANCE_WEIGHT: "0.75"
      RELIABILITY_WEIGHT: "0.25"
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/instantfood"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-prod}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/callback}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY}"
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-true}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-instant-food-decision-engine}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID}"
      ANALYTICS_ENABLED: "${ANALYTICS_ENABLED:-true}"
      ANALYTICS_ADMIN_EMAILS: "${ANALYTICS_ADMIN_EMAILS:-}"
      ANALYTICS_EVENTS_RETENTION_DAYS: "${ANALYTICS_EVENTS_RETENTION_DAYS:-90}"
      ANALYTICS_REQUESTS_RETENTION_DAYS: "${ANALYTICS_REQUESTS_RETENTION_DAYS:-30}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-*}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Bound to localhost so Redis is reachable from the host for debugging but never
    # exposed publicly; the api service reaches it over the compose network regardless.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: instantfood
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    # Localhost-only; not reachable from outside the host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
