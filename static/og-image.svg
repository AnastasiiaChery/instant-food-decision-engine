<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f6f2"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6af0"/>
      <stop offset="1" stop-color="#2455d4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand lockup -->
  <g transform="translate(90,80)">
    <rect width="68" height="68" rx="16" fill="url(#g)"/>
    <g transform="scale(0.06640625)">
      <path d="M512 880 C 420 690 330 612 330 498 A 182 182 0 0 1 694 498 C 694 612 604 690 512 880 Z" fill="#fff"/>
      <circle cx="512" cy="236" r="76" fill="#fff"/>
      <circle cx="446" cy="266" r="58" fill="#fff"/>
      <circle cx="578" cy="266" r="58" fill="#fff"/>
      <rect x="404" y="286" width="216" height="64" rx="26" fill="#fff"/>
      <path d="M412 352 H612" stroke="#2455d4" stroke-width="12" stroke-linecap="round"/>
      <path d="M432 484 Q460 456 488 484" fill="none" stroke="#2455d4" stroke-width="22" stroke-linecap="round"/>
      <path d="M536 484 Q564 456 592 484" fill="none" stroke="#2455d4" stroke-width="22" stroke-linecap="round"/>
      <path d="M456 534 Q512 600 568 534" fill="none" stroke="#2455d4" stroke-width="30" stroke-linecap="round"/>
    </g>
    <text x="90" y="46" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-1" fill="#1a1918">nom<tspan fill="#2455d4">pilot</tspan></text>
  </g>

  <!-- hero -->
  <text x="88" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#1a1918">Stop deciding.</text>
  <text x="88" y="408" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" fill="#1a1918">Start <tspan fill="#2455d4" font-style="italic">eating.</tspan></text>

  <!-- subline -->
  <text x="90" y="494" font-family="Helvetica, Arial, sans-serif" font-size="31" fill="#6b6a64">Your AI dining autopilot. The best spot near you,</text>
  <text x="90" y="536" font-family="Helvetica, Arial, sans-serif" font-size="31" fill="#6b6a64">picked in seconds.</text>
</svg>
